[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyra"
version = "0.1.0"
description = "Post-quantum cryptography readiness scanner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "KYRA Team" },
]
keywords = ["cryptography", "post-quantum", "pqc", "cbom", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
kyra = "kyra.cli.main:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/fixtures/**/*.py" = ["S324", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kyra --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cryptography.*", "typer.*", "rich.*", "yaml.*"]
ignore_missing_imports = true
